name: terraform

on:
  # Invoked as a job from deploy.yaml (see that file) rather than triggered
  # directly - keeps "when infra gets touched" decided in one place.
  workflow_call:
  # Also runnable standalone (Actions tab, "Run workflow") for an ad-hoc
  # apply without going through deploy.yaml at all.
  workflow_dispatch:

# id-token: write is required for the OIDC federation step below (requests
# a short-lived AWS credential, rather than storing long-lived AWS access
# keys as a GitHub secret). contents: read is just for actions/checkout.
# When this workflow runs via workflow_call, the caller (deploy.yaml) also
# has to grant these - a called workflow can't be handed more than its
# caller already holds.
permissions:
  id-token: write
  contents: read

jobs:
  apply:
    runs-on: ubuntu-latest
    # Gates the actual `terraform apply` behind required reviewers - this is
    # the riskier operation (real, costly, sometimes destroy/recreate cloud
    # resources) in the whole pipeline, and previously had weaker gating than
    # the kubectl apply it feeds into (which already uses the dev Environment
    # on deploy.yaml). Create this Environment in repo Settings with required
    # reviewers, same as dev, or this doesn't actually gate anything.
    environment: infra
    defaults:
      run:
        working-directory: infra/terraform
    # TF_VAR_aws_region feeds Terraform's own var.aws_region (provider.tf) -
    # previously only the credentials step below got vars.AWS_REGION, so
    # changing that repo Variable would silently move where credentials
    # authenticate without moving where Terraform actually provisions
    # anything (it would stay on var.aws_region's hardcoded default).
    env:
      TF_VAR_aws_region: ${{ vars.AWS_REGION }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v3

      # Caches downloaded provider plugins (hashicorp/aws is tens of MB)
      # between runs, keyed on the lock file - without this, every run
      # re-downloads them from the registry from scratch, the same gap
      # ci.yaml's Maven dependency caching closes for the build.
      - name: Cache Terraform providers
        uses: actions/cache@v4
        with:
          path: infra/terraform/.terraform/providers
          key: ${{ runner.os }}-terraform-providers-${{ hashFiles('infra/terraform/.terraform.lock.hcl') }}

      # One-time manual prerequisite, not created by this workflow: an IAM
      # role that trusts token.actions.githubusercontent.com, scoped (via
      # its trust policy's condition) to this repo
      # (repo:isaiahduncan/linguanest-backend:*) so only this repo's Actions
      # runs can assume it, with whatever AWS permissions this config's
      # resources need (VPC/EKS/RDS/IAM). Either hand-created in the AWS
      # console/CLI, or added as an optional resource to the bootstrap-style
      # local-apply config - not assumed to exist yet either way.
      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_TERRAFORM_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      # Partial backend config (see versions.tf) - the actual bucket/key/
      # table/region are repo Variables, not hardcoded, because they're
      # only known after infra/terraform/bootstrap/ is applied by hand once.
      # These four must be set under Settings > Secrets and variables >
      # Actions > Variables before this workflow can run successfully.
      - name: Terraform init
        run: |
          terraform init \
            -backend-config="bucket=${{ vars.TF_STATE_BUCKET }}" \
            -backend-config="key=${{ vars.TF_STATE_KEY }}" \
            -backend-config="region=${{ vars.TF_STATE_REGION }}" \
            -backend-config="dynamodb_table=${{ vars.TF_STATE_DYNAMODB_TABLE }}"

      - name: Terraform plan
        run: terraform plan -input=false -out=tfplan

      # `-auto-approve` because this job's own `environment: infra` gate
      # above (required reviewers) is what stands in for the interactive
      # approval a human running `terraform apply` locally would get from
      # reviewing the plan themselves - the plan already ran and the gate
      # already passed by the time this step executes.
      - name: Terraform apply
        run: terraform apply -input=false -auto-approve tfplan
