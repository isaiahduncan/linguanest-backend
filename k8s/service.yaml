apiVersion: v1
kind: Service
metadata:
  name: linguanest-api
  namespace: linguanest-api-dev
spec:
  selector:
    app: linguanest-api
  ports:
    - port: 80
      targetPort: 8080
  # ClusterIP is internal-only - k8s/ingress.yaml is what exposes this
  # externally, via the AWS Load Balancer Controller on EKS.
  type: ClusterIP
