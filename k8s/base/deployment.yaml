apiVersion: apps/v1
kind: Deployment
metadata:
  name: linguanest-api
  # namespace intentionally omitted - each environment's overlay sets it via
  # kustomization.yaml's `namespace:` field (see overlays/dev/kustomization.yaml).
  labels:
    app: linguanest-api
spec:
  # replicas and the resources block below are sizing knobs, not identity -
  # they get a sensible low default here, and only environments needing more
  # (e.g. prod) patch them upward. Unlike SPRING_PROFILES_ACTIVE, dev doesn't
  # need to patch these since this default already suits it.
  replicas: 2
  selector:
    matchLabels:
      app: linguanest-api
  template:
    metadata:
      labels:
        app: linguanest-api
    spec:
      containers:
        - name: linguanest-api
          # No tag here on purpose - every overlay's `kustomize edit set image`
          # step (run by deploy.yaml at deploy time, not committed) overwrites
          # this. This bare reference is never meant to be applied as-is.
          image: ghcr.io/isaiahduncan/linguanest-backend
          ports:
            - containerPort: 8080
          envFrom:
            - configMapRef:
                name: backend-config
          resources:
            requests:
              cpu: 250m
              memory: 384Mi
            limits:
              cpu: 1000m
              memory: 512Mi
          readinessProbe:
            httpGet:
              path: /actuator/health/readiness
              port: 8080
            initialDelaySeconds: 10
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /actuator/health/liveness
              port: 8080
            initialDelaySeconds: 20
            periodSeconds: 15
