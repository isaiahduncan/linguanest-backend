apiVersion: apps/v1
kind: Deployment
metadata:
  name: linguanest-api
  namespace: linguanest-api-dev
  labels:
    app: linguanest-api
spec:
  replicas: 2
  selector:
    matchLabels:
      app: linguanest-api
  template:
    metadata:
      labels:
        app: linguanest-api
    spec:
      # TODO: add imagePullSecrets here once the image lives in a private registry
      # (e.g. GHCR) - required for the cluster to authenticate the pull.
      containers:
        - name: linguanest-api
          # TODO: this image hasn't actually been built/pushed anywhere yet - no
          # registry push has happened and no CI pipeline exists to produce it, so
          # this reference won't resolve until an image lands in a real registry
          # under this name/tag.
          image: linguanest-backend:latest
          ports:
            - containerPort: 8080
          envFrom:
            - configMapRef:
                name: backend-config
          resources:
            requests:
              cpu: 250m
              memory: 384Mi
            limits:
              cpu: 1000m
              memory: 512Mi
          readinessProbe:
            httpGet:
              path: /actuator/health/readiness
              port: 8080
            initialDelaySeconds: 10
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /actuator/health/liveness
              port: 8080
            initialDelaySeconds: 20
            periodSeconds: 15
